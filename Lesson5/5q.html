<!DOCTYPE html>
<html>
<head>
	<title>Calculator</title>
</head>
<body>
	<button onclick="
		calculation+='1';
		">1</button>
	<button onclick="
		calculation+='2';
	">2</button>
	<button onclick="
		calculation+='3';
	">3</button>
	<button onclick="
		calculation+=' + ';
		console.log(calculation)
	">+</button>
	<button onclick="
		console.log(eval(calculation))
	">=</button>
	<script>
		let calculation='';
	</script>
</body>
</html>
