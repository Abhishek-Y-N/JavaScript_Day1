<!DOCTYPE html>

    <body>
        <script>
            function greet(name)
			{
				if(!name)
				{
					console.log("Hi There!")
				}
				else
				{
                console.log(`Hello ${name}`);
				}
            }
			
            greet();
            greet("Abhishek");
        </script> 
    </body>
